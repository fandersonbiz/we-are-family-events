<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>We Are Family - Supabase Sync v3</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect} = React;
const TASK_TEMPLATES = [
  {title:"Venue Booking - Secure venue", category:"Venue", priority:"High"},
  {title:"Site Visit", category:"Venue", priority:"High"},
  {title:"Contract Signing", category:"Venue", priority:"High"},
  {title:"Catering - Menu Tasting", category:"Food", priority:"High"},
  {title:"Final Headcount", category:"Food", priority:"Med"},
  {title:"Dietary Accommodations", category:"Food", priority:"Med"},
  {title:"Invitations - Design Invite", category:"Decor", priority:"Med"},
  {title:"Send Save-the-Date", category:"Communication", priority:"Med"},
  {title:"RSVP Tracking", category:"Communication", priority:"Med"},
  {title:"Logistics - Rent Tables/Chairs", category:"Venue", priority:"Med"},
  {title:"Sound System", category:"Logistics", priority:"Low"},
  {title:"Decorations", category:"Decor", priority:"Med"},
  {title:"Activities - Family Games", category:"Activities", priority:"Low"},
  {title:"Photo Booth", category:"Photography", priority:"Low"},
  {title:"DJ/Music", category:"DJ", priority:"Med"},
  {title:"Finance - Collect Dues", category:"Finance", priority:"High"},
  {title:"Sponsorship", category:"Finance", priority:"Low"},
  {title:"Communication - Newsletter", category:"Communication", priority:"Low"},
  {title:"Hashtag Promotion", category:"Communication", priority:"Low"},
  {title:"Photography - Book Photographer", category:"Photography", priority:"Med"},
  {title:"Transportation - Shuttle", category:"Logistics", priority:"Low"},
  {title:"Security - Hire Staff", category:"Logistics", priority:"Low"},
  {title:"Cleanup Crew", category:"Logistics", priority:"Low"},
  {title:"Thank You Notes", category:"Communication", priority:"Low"},
  {title:"Post-Event Survey", category:"Communication", priority:"Low"},
];
const BUDGET_TEMPLATES = [
  {item:"Venue Rental", amount:2500, category:"Venue"},
  {item:"Catering", amount:3500, category:"Food"},
  {item:"Decorations", amount:800, category:"Decor"},
  {item:"Photography", amount:1200, category:"Photography"},
  {item:"DJ", amount:600, category:"DJ"},
  {item:"Tables/Chairs", amount:400, category:"Venue"},
  {item:"Sound System", amount:300, category:"Venue"},
  {item:"Invitations", amount:200, category:"Decor"},
  {item:"Food Supplies", amount:500, category:"Food"},
  {item:"Drinks", amount:400, category:"Food"},
  {item:"Transportation", amount:350, category:"Logistics"},
  {item:"Security", amount:250, category:"Logistics"},
  {item:"Cleanup", amount:150, category:"Logistics"},
  {item:"Photo Booth", amount:500, category:"Photography"},
  {item:"Games/Prizes", amount:200, category:"Activities"},
  {item:"Marketing", amount:150, category:"Decor"},
  {item:"Insurance", amount:300, category:"Venue"},
  {item:"Permits", amount:100, category:"Venue"},
  {item:"Contingency", amount:500, category:"Finance"},
  {item:"Gifts", amount:250, category:"Decor"},
];
function uid(){return Math.random().toString(36).substr(2,9)+Date.now().toString(36);}
function App(){
  const [role, setRole] = useState(localStorage.getItem('waf_role')||'Admin');
  const [currentPage, setCurrentPage] = useState('Dashboard');
  const [selectedProject, setSelectedProject] = useState(null);
  const [showCreate, setShowCreate] = useState(false);
  const [wizardStep, setWizardStep] = useState(1);
  const [form, setForm] = useState({name:'', startDate:'', endDate:'', location:'', description:'', hashtag:'', budget:'', theme:'Classic'});
  const [supabaseUrl, setSupabaseUrl] = useState(localStorage.getItem('waf_supabase_url')||'');
  const [supabaseKey, setSupabaseKey] = useState(localStorage.getItem('waf_supabase_key')||'');
  const [supabaseClient, setSupabaseClient] = useState(null);
  const [syncStatus, setSyncStatus] = useState('local');
  const [showSupabaseSetup, setShowSupabaseSetup] = useState(false);
  const [inviteLink, setInviteLink] = useState('');
  const [editingProject, setEditingProject] = useState(null);
  const [editName, setEditName] = useState('');
  const [activeTab, setActiveTab] = useState('Active');
  const [projectDetailTab, setProjectDetailTab] = useState('Overview');
  const [search, setSearch] = useState('');
  const [projectFilter, setProjectFilter] = useState('All');
  const [adminName, setAdminName] = useState(localStorage.getItem('waf_adminName')||'Frederick IMpowered Anderson');
  const [showTaskModal, setShowTaskModal] = useState(false);
  const [taskForm, setTaskForm] = useState({title:'', description:'', projectId:'', assignedTo:'', dueDate:'', priority:'Med', category:'General'});
  const [showMemberModal, setShowMemberModal] = useState(false);
  const [memberForm, setMemberForm] = useState({name:'', email:'', phone:'', role:'Coordinator', privilege:'Editor', projects:[]});
  const [closeConfirm, setCloseConfirm] = useState(null);

  const [mainProjects, setMainProjects] = useState(()=>{const s=localStorage.getItem('waf_mains'); try{return s?JSON.parse(s):[{id:'main1', name:'Anderson Family Reunion 2026', startDate:'2026-07-04', endDate:'2026-07-06', location:'Fate, TX Community Center', description:'Annual reunion - 50 years', hashtag:'#WeAreFamily2026', startingBudget:15000, status:'Active', createdBy:'Frederick IMpowered Anderson', createdAt:new Date().toISOString(), uniqueID:uid()}]}catch(e){return []}});
  const [miniProjects, setMiniProjects] = useState(()=>{const s=localStorage.getItem('waf_minis'); try{return s?JSON.parse(s):[{id:'mini1', name:'Welcome BBQ Night', parentMainProjectId:'main1', startDate:'2026-07-04', endDate:'2026-07-04', location:'Fate Park', hashtag:'#BBQNight', budget:800, status:'Active'}]}catch(e){return []}});
  const [committee, setCommittee] = useState(()=>{const s=localStorage.getItem('waf_committee'); try{return s?JSON.parse(s):[{id:'c1', name:'Frederick IMpowered Anderson', email:'frederick@wearefamily.com', phone:'214-555-0101', role:'Main Admin', privilege:'Editor', projects:['main1','mini1'], status:'Active', avatarInitials:'FA', isMainAdmin:true},{id:'c2', name:'Sarah Johnson', email:'sarah@family.com', phone:'214-555-0102', role:'Logistics Lead', privilege:'Editor', projects:['main1'], status:'Active', avatarInitials:'SJ', isMainAdmin:false}]}catch(e){return []}});
  const [tasks, setTasks] = useState(()=>{const s=localStorage.getItem('waf_tasks'); try{return s?JSON.parse(s):TASK_TEMPLATES.slice(0,8).map(t=>({id:uid(), title:t.title, description:'', projectId:'main1', assignedTo:'c2', dueDate:'2026-06-15', priority:t.priority, category:t.category, status:'Active', archivedReason:'', createdBy:'Frederick'}))}catch(e){return []}});
  const [budgets, setBudgets] = useState(()=>{const s=localStorage.getItem('waf_budgets'); try{return s?JSON.parse(s):BUDGET_TEMPLATES.slice(0,6).map(b=>({id:uid(), item:b.item, amount:b.amount, category:b.category, projectId:'main1', paid:false, status:'Active'}))}catch(e){return []}});

  useEffect(()=>{
    if(supabaseUrl && supabaseKey){
      try{
        const client = window.supabase.createClient(supabaseUrl, supabaseKey);
        setSupabaseClient(client);
        setSyncStatus('connecting');
        client.from('main_projects').select('id').limit(1).then(({error})=>{
          if(error){console.log('Supabase table not yet created', error.message); setSyncStatus('needs-setup');} else {setSyncStatus('connected'); loadFromSupabase(client);}
        });
        localStorage.setItem('waf_supabase_url', supabaseUrl);
        localStorage.setItem('waf_supabase_key', supabaseKey);
      }catch(e){setSyncStatus('error');}
    }
  },[]);

  async function loadFromSupabase(client){
    const {data: mains} = await client.from('main_projects').select('*').order('created_at', {ascending:true});
    if(mains && mains.length>0) setMainProjects(mains.map(m=>({id:m.id, name:m.name, startDate:m.start_date, endDate:m.end_date, location:m.location, description:m.description, hashtag:m.hashtag, startingBudget:m.starting_budget, status:m.status, createdBy:m.created_by, createdAt:m.created_at, uniqueID:m.unique_id})));
    const {data: tasksData} = await client.from('tasks').select('*');
    if(tasksData && tasksData.length>0) setTasks(tasksData.map(t=>({id:t.id, title:t.title, description:t.description, projectId:t.project_id, assignedTo:t.assigned_to, dueDate:t.due_date, priority:t.priority, category:t.category, status:t.status, archivedReason:t.archived_reason, createdBy:t.created_by})));
    // Realtime subscriptions
    client.channel('realtime').on('postgres_changes', {event:'*', schema:'public', table:'tasks'}, payload=>{loadFromSupabase(client);}).subscribe();
    client.channel('realtime2').on('postgres_changes', {event:'*', schema:'public', table:'main_projects'}, payload=>{loadFromSupabase(client);}).subscribe();
  }

  async function saveToSupabase(table, data){
    if(!supabaseClient || syncStatus!=='connected') return;
    try{await supabaseClient.from(table).upsert(data);}catch(e){console.log('Sync error', e);}
  }

  useEffect(()=>{localStorage.setItem('waf_mains', JSON.stringify(mainProjects)); if(supabaseClient && syncStatus==='connected'){mainProjects.forEach(p=>{saveToSupabase('main_projects', {id:p.id, name:p.name, start_date:p.startDate, end_date:p.endDate, location:p.location, description:p.description, hashtag:p.hashtag, starting_budget:p.startingBudget, status:p.status, created_by:p.createdBy, created_at:p.createdAt, unique_id:p.uniqueID});});}},[mainProjects]);
  useEffect(()=>{localStorage.setItem('waf_tasks', JSON.stringify(tasks)); if(supabaseClient && syncStatus==='connected'){tasks.forEach(t=>{saveToSupabase('tasks', {id:t.id, title:t.title, description:t.description, project_id:t.projectId, assigned_to:t.assignedTo, due_date:t.dueDate, priority:t.priority, category:t.category, status:t.status, archived_reason:t.archivedReason, created_by:t.createdBy});});}},[tasks]);

  function connectSupabase(){
    if(!supabaseUrl || !supabaseKey){alert('Enter URL and anon key'); return;}
    try{
      const client = window.supabase.createClient(supabaseUrl, supabaseKey);
      setSupabaseClient(client);
      setSyncStatus('connected');
      localStorage.setItem('waf_supabase_url', supabaseUrl);
      localStorage.setItem('waf_supabase_key', supabaseKey);
      setShowSupabaseSetup(false);
      alert('Connected! Now team will see same updates. Create tables in Supabase with SQL below.');
    }catch(e){alert('Connection failed: '+e.message);}
  }

  function createMainProject(){
    if(!form.name) return;
    if(form.hashtag && !form.hashtag.startsWith('#')){alert('Hashtag must start with #'); return;}
    const id = uid();
    const newMain = {id, name:form.name, startDate:form.startDate, endDate:form.endDate, location:form.location, description:form.description, hashtag:form.hashtag||'#WeAreFamily', startingBudget:parseFloat(form.budget)||0, status:'Active', createdBy:adminName, createdAt:new Date().toISOString(), uniqueID:uid()};
    setMainProjects([...mainProjects, newMain]);
    const newTasks = TASK_TEMPLATES.map(t=>({id:uid(), title:t.title, description:'', projectId:id, assignedTo:committee[1]?.id||committee[0].id, dueDate:form.startDate||new Date().toISOString().split('T')[0], priority:t.priority, category:t.category, status:'Active', archivedReason:'', createdBy:adminName}));
    setTasks([...tasks, ...newTasks]);
    setShowCreate(false); setWizardStep(1); setForm({name:'', startDate:'', endDate:'', location:'', description:'', hashtag:'', budget:'', theme:'Classic'});
  }

  function handleAddMember(){
    if(!memberForm.name || !memberForm.email) return;
    const id = uid();
    const newMember = {id, name:memberForm.name, email:memberForm.email, phone:memberForm.phone, role:memberForm.role, privilege:memberForm.privilege, projects:memberForm.projects, status:'Active', avatarInitials:memberForm.name.split(' ').map(n=>n[0]).join('').substring(0,2), isMainAdmin:false};
    setCommittee([...committee, newMember]);
    const baseUrl = window.location.origin + window.location.pathname;
    const link = `${baseUrl}?invite=${encodeURIComponent(memberForm.email)}&project=${memberForm.projects[0]||mainProjects[0]?.id||''}&role=${encodeURIComponent(memberForm.role)}`;
    setInviteLink(link);
    navigator.clipboard.writeText(link).then(()=>alert(`Member added! Invite link copied: ${link}`));
    setShowMemberModal(false);
    setMemberForm({name:'', email:'', phone:'', role:'Coordinator', privilege:'Editor', projects:[]});
  }

  useEffect(()=>{
    const params = new URLSearchParams(window.location.search);
    const inviteEmail = params.get('invite');
    if(inviteEmail){
      const proj = params.get('project');
      const roleParam = params.get('role');
      if(confirm(`You've been invited as ${roleParam||'Committee Member'}! Join with email ${inviteEmail}?`)){
        const exists = committee.find(c=>c.email.toLowerCase()===inviteEmail.toLowerCase());
        if(!exists){
          const newMem = {id:uid(), name:inviteEmail.split('@')[0], email:inviteEmail, phone:'', role:roleParam||'Coordinator', privilege:'Editor', projects:proj?[proj]:[], status:'Active', avatarInitials:inviteEmail.substring(0,2).toUpperCase(), isMainAdmin:false};
          setCommittee([...committee, newMem]);
          alert('Welcome! You joined the team. You will now see the same projects and updates as everyone else (if Supabase is connected).');
        }
      }
      window.history.replaceState({}, document.title, window.location.pathname);
    }
  },[]);

  const stats = {activeMains: mainProjects.filter(p=>p.status==='Active').length, openTasks: tasks.filter(t=>t.status==='Active').length, remaining: mainProjects.reduce((s,p)=>s+(p.startingBudget||0),0) - budgets.filter(b=>b.paid).reduce((s,b)=>s+b.amount,0)};

  return (
    <div className="min-h-screen bg-[#f8fafc]">
      <div className="h-16 bg-gradient-to-r from-[#1e40af] to-[#1e3a8a] text-white flex items-center px-6 justify-between sticky top-0 z-50 border-b-4 border-[#dc2626]">
        <div className="flex items-center gap-3"><div className="w-9 h-9 bg-white rounded-lg flex items-center justify-center text-[#1e3a8a] font-black text-xl">W</div><span className="font-bold text-lg">We Are Family Events</span><span className={`flex items-center gap-1 text-xs px-2 py-1 rounded-full ml-2 ${syncStatus==='connected'?'bg-green-500/30':'bg-yellow-500/30'}`}><span className={`w-2 h-2 rounded-full ${syncStatus==='connected'?'bg-green-400':'bg-yellow-400'} animate-pulse`}></span>{syncStatus==='connected'?'Team Sync ON':syncStatus==='needs-setup'?'Needs DB Setup':'Local Only'}</span></div>
        <div className="flex items-center gap-2"><button onClick={()=>setShowSupabaseSetup(true)} className="px-3 py-1.5 bg-white/20 rounded-full text-sm">⚙️ Supabase Sync</button><div className="w-7 h-7 bg-[#f59e0b] rounded-full flex items-center justify-center text-[#1e3a8a] font-bold text-xs">FA</div></div>
      </div>
      <div className="flex">
        <div className="w-[280px] bg-white border-r min-h-[calc(100vh-64px)] p-4 sticky top-16 h-[calc(100vh-64px)] overflow-y-auto">
          <div className={syncStatus==='connected' ? 'p-3 bg-green-50 border border-green-200 rounded-xl mb-4' : 'p-3 bg-yellow-50 border border-yellow-200 rounded-xl mb-4'}>
            <div className="text-xs font-bold">{syncStatus==='connected'?'✅ TEAM IN-SYNC':'⚠️ LOCAL ONLY'}</div>
            <div className="text-xs mt-1">{syncStatus==='connected'?'Everyone sees same updates instantly via Supabase Realtime':'Connect Supabase to enable team sync'}</div>
            <button onClick={()=>setShowSupabaseSetup(true)} className="mt-2 text-xs bg-[#1e3a8a] text-white px-2 py-1 rounded">Setup Sync</button>
          </div>
          <nav className="space-y-1">{['Dashboard','Projects','Master Tasks','Committee','Calendar','Conference','Message Board','Action/Decision Log','Admin Cloud Sync'].map(p=><button key={p} onClick={()=>setCurrentPage(p)} className={currentPage===p?'w-full text-left px-3 py-2.5 rounded-lg bg-[#dc2626] text-white font-medium':'w-full text-left px-3 py-2.5 rounded-lg hover:bg-[#dbeafe] text-gray-700'}>{p}</button>)}</nav>
          <div className="mt-6 p-3 bg-gray-50 rounded-xl text-sm"><div>Active Mains: {stats.activeMains}</div><div>Open Tasks: {stats.openTasks}</div><div>Remaining: ${stats.remaining.toLocaleString()}</div></div>
        </div>
        <div className="flex-1 p-6 max-w-[1200px]">
          {currentPage==='Dashboard' && (
            <div>
              <div className="bg-white p-5 rounded-xl shadow mb-6 border-l-4 border-green-500">
                <h2 className="font-bold text-lg">Team Sync Status</h2>
                <div className="mt-2 text-sm">
                  {syncStatus==='connected' ? <div className="text-green-700">✅ Supabase connected! When you add a committee member, task, or budget, everyone on the team sees it instantly. Invite links work: new members join via link and are added to cloud.</div> : <div className="text-yellow-700">⚠️ Currently local only. Team members on other devices won't see your updates yet. Click Setup Sync to enable real-time team sync.</div>}
                </div>
                <div className="mt-3 flex gap-2"><button onClick={()=>setShowCreate(true)} className="px-5 py-2.5 bg-[#1e3a8a] text-white rounded-lg font-semibold">Create New Gathering</button><button onClick={()=>setShowSupabaseSetup(true)} className="px-4 py-2 border rounded-lg">Configure Supabase</button></div>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {mainProjects.filter(p=>p.status==='Active').map(p=>{
                  const t = tasks.filter(x=>x.projectId===p.id); const done = t.filter(x=>x.status==='Completed').length; const progress = t.length?Math.round(done/t.length*100):0;
                  return <div key={p.id} className="bg-white rounded-xl p-5 shadow border-l-4 border-[#dc2626]"><div className="font-bold text-lg">{p.name}</div><div className="text-sm text-blue-600">{p.hashtag}</div><div className="mt-2 w-full bg-gray-200 h-2 rounded"><div className="bg-[#1e3a8a] h-2 rounded" style={{width:`${progress}%`}}></div></div><div className="mt-2 text-xs">{done}/{t.length} tasks • ${p.startingBudget}</div><button onClick={()=>{setSelectedProject(p); setCurrentPage('Project Detail');}} className="mt-3 w-full bg-[#2563eb] text-white py-2 rounded-lg text-sm">View Details</button></div>;
                })}
              </div>
            </div>
          )}
          {currentPage==='Project Detail' && selectedProject && (
            <div>
              <button onClick={()=>setCurrentPage('Dashboard')} className="mb-4 px-3 py-1 bg-white border rounded">← Back</button>
              <h1 className="text-2xl font-bold">{selectedProject.name}</h1>
              <div className="mt-4 bg-white p-5 rounded-xl shadow">
                <h3 className="font-bold">Tasks for this Project</h3>
                <div className="mt-2 space-y-2">{tasks.filter(t=>t.projectId===selectedProject.id).map(t=><div key={t.id} className="flex items-center gap-2 p-2 border rounded"><input type="checkbox" checked={t.status==='Completed'} onChange={()=>{const updated=tasks.map(x=>x.id===t.id?{...x, status:x.status==='Completed'?'Active':'Completed'}:x); setTasks(updated);}}/><span className="flex-1 text-sm">{t.title}</span><span className="text-xs bg-gray-100 px-2 py-1 rounded">{t.status}</span></div>)}</div>
                <button onClick={()=>{const title=prompt('Task title:'); if(title) setTasks([...tasks, {id:uid(), title, description:'', projectId:selectedProject.id, assignedTo:committee[0]?.id||'', dueDate:'', priority:'Med', category:'General', status:'Active', archivedReason:'', createdBy:adminName}]);}} className="mt-3 px-3 py-1 bg-[#2563eb] text-white rounded text-sm">Add Task (Syncs to team if Supabase ON)</button>
              </div>
            </div>
          )}
          {currentPage==='Committee' && (
            <div>
              <h1 className="text-2xl font-bold">Committee - Team Sync</h1>
              {inviteLink && <div className="mt-4 p-3 bg-green-50 border border-green-200 rounded-xl"><div className="text-sm font-bold">Last Invite Link (copied to clipboard):</div><div className="text-xs break-all mt-1 text-blue-600">{inviteLink}</div><button onClick={()=>navigator.clipboard.writeText(inviteLink)} className="mt-2 text-xs bg-green-600 text-white px-2 py-1 rounded">Copy Again</button></div>}
              <div className="grid grid-cols-3 gap-4 mt-4">{committee.map(m=><div key={m.id} className="bg-white p-4 rounded-xl shadow border-l-4 border-[#dc2626]"><div className="flex items-center gap-3"><div className="w-10 h-10 rounded-full bg-[#1e3a8a] text-white flex items-center justify-center font-bold">{m.avatarInitials}</div><div><div className="font-bold text-sm">{m.name}</div><div className="text-xs text-gray-500">{m.role} • {m.email}</div></div></div><div className="mt-2 text-xs">{m.projects.map(pid=>mainProjects.find(p=>p.id===pid)?.name||pid).join(', ')}</div></div>)}</div>
              <button onClick={()=>setShowMemberModal(true)} className="mt-4 px-4 py-2 bg-[#1e3a8a] text-white rounded-lg">Add Committee Member + Generate Invite Link</button>
              <div className="mt-6 bg-white p-4 rounded-xl shadow"><h3 className="font-bold">How Team Sync Works Now</h3><div className="text-sm mt-2 space-y-1"><p>1. Add member → invite link auto-copied → send via text/email</p><p>2. Member clicks link → auto-joins your team</p><p>3. If Supabase connected: everyone sees same tasks/budgets/projects instantly via Realtime</p><p>4. If not connected: use Export JSON in Admin Cloud Sync to share updates manually</p></div></div>
            </div>
          )}
          {currentPage==='Admin Cloud Sync' && (
            <div>
              <h1 className="text-2xl font-bold">Admin Cloud Sync - Supabase Setup</h1>
              <div className="mt-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                <div className="bg-white p-5 rounded-xl shadow"><h3 className="font-bold">Current Status</h3><div className="mt-2"><div className={`px-3 py-2 rounded-full text-sm ${syncStatus==='connected'?'bg-green-100 text-green-700':'bg-yellow-100 text-yellow-700'}`}>{syncStatus}</div><div className="mt-3 text-sm">Mains: {mainProjects.length} Tasks: {tasks.length}</div><button onClick={()=>{const data={mainProjects, tasks, budgets, committee}; const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='backup.json'; a.click();}} className="mt-3 w-full px-4 py-2 bg-[#1e3a8a] text-white rounded-lg text-sm">Export JSON Backup (manual sync)</button></div></div>
                <div className="bg-white p-5 rounded-xl shadow"><h3 className="font-bold">Setup Supabase (5 min, free, team sync)</h3><div className="mt-2 text-sm space-y-2"><p>1. Go to supabase.com → New Project → name we-are-family → free tier</p><p>2. Copy Project URL and anon key from Settings → API</p><p>3. Paste below and Connect</p><p>4. Run SQL in Supabase SQL Editor (see below)</p></div><button onClick={()=>setShowSupabaseSetup(true)} className="mt-3 w-full px-4 py-2 bg-green-600 text-white rounded-lg">Enter Supabase Credentials</button></div>
              </div>
              <div className="mt-6 bg-white p-5 rounded-xl shadow"><h3 className="font-bold">SQL to run in Supabase SQL Editor (copy/paste)</h3><pre className="mt-2 bg-gray-900 text-green-400 p-4 rounded text-xs overflow-x-auto">{`-- Enable Realtime and create tables
create table main_projects (id text primary key, name text, start_date text, end_date text, location text, description text, hashtag text, starting_budget numeric, status text, created_by text, created_at text, unique_id text);
create table tasks (id text primary key, title text, description text, project_id text, assigned_to text, due_date text, priority text, category text, status text, archived_reason text, created_by text);
create table committee_members (id text primary key, name text, email text, phone text, role text, privilege text, projects jsonb, status text, avatar_initials text, is_main_admin boolean);
-- Enable RLS and allow all for now (lock down later)
alter table main_projects enable row level security; create policy "allow all" on main_projects for all using (true) with check (true);
alter table tasks enable row level security; create policy "allow all" on tasks for all using (true) with check (true);
alter table committee_members enable row level security; create policy "allow all" on committee_members for all using (true) with check (true);
-- Enable Realtime
alter publication supabase_realtime add table main_projects;
alter publication supabase_realtime add table tasks;
`}</pre></div>
            </div>
          )}
          {(currentPage==='Master Tasks' || currentPage==='Projects') && (
            <div><h1 className="text-2xl font-bold">{currentPage}</h1><div className="mt-4 bg-white p-4 rounded-xl shadow"><div className="text-sm">This page works with team sync when Supabase is connected. Add tasks in Dashboard → Project Detail. All tasks sync via Realtime to team.</div><div className="mt-3 space-y-2">{tasks.slice(0,10).map(t=><div key={t.id} className="text-sm p-2 border rounded flex justify-between"><span>{t.title}</span><span className="text-xs bg-gray-100 px-2 py-1 rounded">{t.status}</span></div>)}</div></div></div>
          )}
        </div>
      </div>
      {showCreate && <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[100] p-4"><div className="bg-white rounded-2xl w-full max-w-lg p-6"><h2 className="font-bold text-xl">Create New Gathering</h2><div className="mt-4 space-y-3"><input value={form.name} onChange={e=>setForm({...form, name:e.target.value})} placeholder="Name *" className="w-full border rounded-lg px-3 py-2"/><input type="date" value={form.startDate} onChange={e=>setForm({...form, startDate:e.target.value})} className="w-full border rounded-lg px-3 py-2"/><input value={form.hashtag} onChange={e=>setForm({...form, hashtag:e.target.value})} placeholder="#Hashtag" className="w-full border rounded-lg px-3 py-2"/><input type="number" value={form.budget} onChange={e=>setForm({...form, budget:e.target.value})} placeholder="Starting Budget" className="w-full border rounded-lg px-3 py-2"/><div className="flex justify-end gap-2"><button onClick={()=>setShowCreate(false)} className="px-4 py-2 border rounded-lg">Cancel</button><button onClick={createMainProject} className="px-4 py-2 bg-[#1e3a8a] text-white rounded-lg">Create + Auto Templates (Syncs to team)</button></div></div></div></div>}
      {showMemberModal && <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[100] p-4"><div className="bg-white rounded-2xl w-full max-w-md p-6"><h3 className="font-bold">Add Committee Member + Invite Link</h3><div className="mt-3 space-y-2"><input value={memberForm.name} onChange={e=>setMemberForm({...memberForm, name:e.target.value})} placeholder="Name" className="w-full border rounded px-3 py-2"/><input value={memberForm.email} onChange={e=>setMemberForm({...memberForm, email:e.target.value})} placeholder="Email *" className="w-full border rounded px-3 py-2"/><input value={memberForm.phone} onChange={e=>setMemberForm({...memberForm, phone:e.target.value})} placeholder="Phone" className="w-full border rounded px-3 py-2"/><input value={memberForm.role} onChange={e=>setMemberForm({...memberForm, role:e.target.value})} placeholder="Role" className="w-full border rounded px-3 py-2"/><div className="text-xs">Projects to assign:</div><div className="max-h-20 overflow-y-auto border rounded p-2">{mainProjects.map(p=><label key={p.id} className="flex items-center gap-2 text-xs"><input type="checkbox" checked={memberForm.projects.includes(p.id)} onChange={e=>{if(e.target.checked) setMemberForm({...memberForm, projects:[...memberForm.projects, p.id]}); else setMemberForm({...memberForm, projects:memberForm.projects.filter(id=>id!==p.id)})}}/>{p.name}</label>)}</div><div className="flex justify-end gap-2"><button onClick={()=>setShowMemberModal(false)} className="px-4 py-2 border rounded">Cancel</button><button onClick={handleAddMember} className="px-4 py-2 bg-[#1e3a8a] text-white rounded">Add + Copy Invite Link</button></div><div className="text-xs text-gray-500 mt-2">Invite link auto-copies. Send via text/email. When they click, they auto-join. If Supabase connected, they see same data instantly.</div></div></div></div>}
      {showSupabaseSetup && <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[100] p-4"><div className="bg-white rounded-2xl w-full max-w-lg p-6"><h3 className="font-bold text-lg">Setup Supabase Team Sync (Free)</h3><div className="mt-4 space-y-3"><div><label className="text-xs font-bold">Supabase Project URL</label><input value={supabaseUrl} onChange={e=>setSupabaseUrl(e.target.value)} placeholder="https://xxxx.supabase.co" className="w-full border rounded px-3 py-2 mt-1"/></div><div><label className="text-xs font-bold">Supabase Anon Key</label><textarea value={supabaseKey} onChange={e=>setSupabaseKey(e.target.value)} placeholder="eyJ..." className="w-full border rounded px-3 py-2 mt-1 h-20 text-xs"></textarea></div><div className="bg-blue-50 p-3 rounded text-xs"><p className="font-bold">Steps to get these (2 min):</p><p>1. supabase.com → New Project → Free tier</p><p>2. Settings → API → copy URL + anon key</p><p>3. SQL Editor → paste SQL from Admin Cloud Sync page → Run</p><p>4. Paste here → Connect → Team now in-sync!</p></div><div className="flex justify-end gap-2"><button onClick={()=>setShowSupabaseSetup(false)} className="px-4 py-2 border rounded">Cancel</button><button onClick={connectSupabase} className="px-4 py-2 bg-green-600 text-white rounded">Connect + Enable Team Sync</button></div></div></div></div>}
    </div>
  );
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
