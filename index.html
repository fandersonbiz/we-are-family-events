  });
  const [budgets, setBudgets] = useState(()=>{
    const s = localStorage.getItem('waf_budgets');

  });
  const [meetings, setMeetings] = useState(()=>{
    const s = localStorage.getItem('waf_meetings');
    if(s) try{return JSON.parse(s)}catch(e){}

  });
  const [actionLogs, setActionLogs] = useState(()=>{
    const s = localStorage.getItem('waf_actions');

  });
  const [inbox, setInbox] = useState(()=>{

  });
  const [polls, setPolls] = useState(()=>{
    const s = localStorage.getItem('waf_polls');

  });

  });

  useEffect(()=>{localStorage.setItem('waf_minis', JSON.stringify(miniProjects))},[miniProjects]);
  useEffect(()=>{localStorage.setItem('waf_committee', JSON.stringify(committee))},[committee]);
  useEffect(()=>{localStorage.setItem('waf_general', JSON.stringify(generalMembers))},[generalMembers]);
  useEffect(()=>{localStorage.setItem('waf_tasks', JSON.stringify(tasks))},[tasks]);
  useEffect(()=>{localStorage.setItem('waf_budgets', JSON.stringify(budgets))},[budgets]);
  useEffect(()=>{localStorage.setItem('waf_meetings', JSON.stringify(meetings))},[meetings]);
  useEffect(()=>{localStorage.setItem('waf_actions', JSON.stringify(actionLogs))},[actionLogs]);
  useEffect(()=>{localStorage.setItem('waf_inbox', JSON.stringify(inbox))},[inbox]);
  useEffect(()=>{localStorage.setItem('waf_polls', JSON.stringify(polls))},[polls]);
  useEffect(()=>{localStorage.setItem('waf_board', JSON.stringify(boardMessages))},[boardMessages]);
  useEffect(()=>{localStorage.setItem('waf_adminName', adminName)},[adminName]);
  const currentUser = role==='Admin' ? committee.find(c=>c.isMainAdmin) : committee[1] || committee[0];
  const visibleMains = role==='Admin' ? mainProjects : mainProjects.filter(p=>currentUser?.projects?.includes(p.id));
  const visibleMinis = role==='Admin' ? miniProjects : miniProjects.filter(p=>currentUser?.projects?.includes(p.id) || currentUser?.projects?.includes(p.parentMainProjectId));
  const visibleTasks = role==='Admin' ? tasks : tasks.filter(t=>currentUser?.projects?.includes(t.projectId));
  const visibleBudgets = role==='Admin' ? budgets : budgets.filter(b=>currentUser?.projects?.includes(b.projectId));
  function createMainProject(){
    if(!form.name) return;
    if(form.hashtag && !form.hashtag.startsWith('#')){setHashtagError('Must start with #'); return;}
    const id = uid();
    const newMain = {id, name:form.name, startDate:form.startDate, endDate:form.endDate, location:form.location, description:form.description, hashtag:form.hashtag||'#WeAreFamily', startingBudget:parseFloat(form.budget)||0, status:'Active', createdBy:adminName, createdAt:new Date().toISOString(), uniqueID:uid()};
    setMainProjects([...mainProjects, newMain]);
    const newTasks = TASK_TEMPLATES.map(t=>({id:uid(), title:t.title, description:'', projectId:id, assignedTo:committee[1]?.id||committee[0].id, dueDate:form.startDate||new Date().toISOString().split('T')[0], priority:t.priority, category:t.category, status:'Active', archivedReason:'', createdBy:adminName}));
    setTasks([...tasks, ...newTasks]);
    const newBudgets = BUDGET_TEMPLATES.map(b=>({id:uid(), item:b.item, amount:b.amount, category:b.category, projectId:id, paid:false, status:'Active'}));
    setBudgets([...budgets, ...newBudgets]);
    setShowCreate(false); setWizardStep(1); setForm({name:'', startDate:'', endDate:'', location:'', description:'', hashtag:'', budget:'', theme:'Classic'});
  }
  function handleCloseProject(project){
    const activeMinis = miniProjects.filter(m=>m.parentMainProjectId===project.id && m.status==='Active');
    if(activeMinis.length>0){setCloseConfirm({project, count:activeMinis.length, minis:activeMinis}); return;}
    setMainProjects(mainProjects.map(p=>p.id===project.id?{...p, status:'Closed'}:p));
    setTasks(tasks.map(t=>t.projectId===project.id && t.status==='Active'?{...t, status:'Archived', archivedReason:'Parent closed'}:t));
    setBudgets(budgets.map(b=>b.projectId===project.id && b.status==='Active'?{...b, status:'Archived'}:b));
  }
  function handleCloseAllAndMain(){
    if(!closeConfirm) return;
    const mainId = closeConfirm.project.id;
    setMiniProjects(miniProjects.map(m=>m.parentMainProjectId===mainId?{...m, status:'Closed'}:m));
    setMainProjects(mainProjects.map(p=>p.id===mainId?{...p, status:'Closed'}:p));
    const miniIds = closeConfirm.minis.map(m=>m.id);
    setTasks(tasks.map(t=>(t.projectId===mainId || miniIds.includes(t.projectId)) && t.status==='Active'?{...t, status:'Archived', archivedReason:'Parent closed'}:t));
    setBudgets(budgets.map(b=>(b.projectId===mainId || miniIds.includes(b.projectId)) && b.status==='Active'?{...b, status:'Archived'}:b));
    setCloseConfirm(null);
  }

    const html = document.documentElement.outerHTML;

      {showMemberModal && <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[100] p-4"><div className="bg-white rounded-2xl w-full max-w-md p-6"><h3 className="font-bold">{editingMember?'Edit Member':'Add Committee Member'}</h3><div className="mt-3 space-y-2"><input value={memberForm.name} onChange={e=>setMemberForm({...memberForm, name:e.target.value})} placeholder="Name" className="w-full border rounded px-3 py-2"/><input value={memberForm.email} onChange={e=>setMemberForm({...memberForm, email:e.target.value})} placeholder="Email" className="w-full border rounded px-3 py-2"/><input value={memberForm.phone} onChange={e=>setMemberForm({...memberForm, phone:e.target.value})} placeholder="Phone" className="w-full border rounded px-3 py-2"/><div className="grid grid-cols-2 gap-2"><input value={memberForm.role} onChange={e=>setMemberForm({...memberForm, role:e.target.value})} placeholder="Role" className="border rounded px-3 py-2"/><select value={memberForm.privilege} onChange={e=>setMemberForm({...memberForm, privilege:e.target.value})} className="border rounded px-3 py-2"><option>Editor</option><option>Viewer</option></select></div><div className="text-xs font-bold mt-2">Projects:</div><div className="max-h-24 overflow-y-auto border rounded p-2 space-y-1">{[...mainProjects, ...miniProjects].filter(p=>p.status==='Active').map(p=><label key={p.id} className="flex items-center gap-2 text-xs"><input type="checkbox" checked={memberForm.projects.includes(p.id)} onChange={e=>{if(e.target.checked) setMemberForm({...memberForm, projects:[...memberForm.projects, p.id]}); else setMemberForm({...memberForm, projects:memberForm.projects.filter(id=>id!==p.id)})}}/>{p.name}</label>)}<label className="flex items-center gap-2 text-xs"><input type="checkbox" checked={memberForm.projects.length===0} onChange={e=>{if(e.target.checked) setMemberForm({...memberForm, projects:[]})}}/> No project yet - assign later</label></div><div className="flex justify-end gap ext-xs bg-blue-600 text-white px-2 py-1 rounded">Add</button></div><div className="mt-1 space-y-1">{meetingForm.agenda.map((a,i)=><div key={i} className="text-xs flex justify-between"><span>{a.text} - {a.owner} ({a.duration}m)</span><button onClick={()=>setMeetingForm({...meetingForm, agenda:meetingForm.agenda.filter((_,idx)=>idx!==i)})} className="text-red-500">x</button></div>)}</div></div><div className="flex justify-end gap-2 mt-3"><button onClick={()=>setShowMeetingModal(false)} className="px-4 py-2 border rounded">Cancel</button><button onClick={()=>{const id=uid(); setMeetings([...meetings, {id, ...meetingForm, jitsiLink:`https://meet.jit.si/we-are-family-meeting-${id}`, status:'Scheduled', minutes:''}]); setShowMeetingModal(false); setMeetingForm({title:'', projectId:'', dateTime:'', location:'', agenda:[], minutes:'', status:'Scheduled'})}} className="px-4 py-2 bg-purple-600 text-white rounded">Create</button></div></div></div></div>}

lls([...polls, {id:uid(), title:pollForm.title, description:pollForm.description, projectId:pollForm.projectId, options:pollForm.options.filter(o=>o).map(o=>({text:o, votes:[]})), deadline:pollForm.deadline, multiple:pollForm.multiple, status:'Active', createdBy:committee.find(c=>c.isMainAdmin)?.id||'c1'}]); setShowPollModal(false); setPollForm({title:'', description:'', projectId:'', options:['',''], deadline:'', multiple:false})}} className="px-4 py-2 bg-[#1e3a8a] text-white rounded">Create Poll</button></div></div></div></div>}
