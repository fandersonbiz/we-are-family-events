<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>We Are Family v4 - Full Auto Sync</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:Inter,sans-serif}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const {useState, useEffect} = React;
const SUPABASE_URL = "https://gzpoiworafpgmzoslldy.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6cG9pd29yYWZwZ216b3NsbGR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3NjM2MDgsImV4cCI6MjEwNzMzOTYwOH0.3s26suVU5zv-pXq07ypho4ug9a4ntbU6jSBS7VsUnD8";
const uid = () => Math.random().toString(36).substr(2,9)+Date.now().toString(36);
const TASK_TEMPLATES = [{t:"Venue Booking - Secure venue",c:"Venue",p:"High"},{t:"Site Visit",c:"Venue",p:"High"},{t:"Catering - Menu Tasting",c:"Food",p:"High"},{t:"Invitations - Design Invite",c:"Decor",p:"Med"},{t:"RSVP Tracking",c:"Communication",p:"Med"},{t:"Finance - Collect Dues",c:"Finance",p:"High"}];
function App(){
 const [role,setRole]=useState('Admin');
 const [page,setPage]=useState('Dashboard');
 const [selProj,setSelProj]=useState(null);
 const [showCreate,setShowCreate]=useState(false);
 const [form,setForm]=useState({name:'', startDate:'', location:'', hashtag:'', budget:''});
 const [supabaseClient,setSupabaseClient]=useState(null);
 const [syncStatus,setSyncStatus]=useState('connecting');
 const [inviteLink,setInviteLink]=useState('');
 const [showMemberModal,setShowMemberModal]=useState(false);
 const [memberForm,setMemberForm]=useState({name:'',email:'',role:'Coordinator',projects:[]});
 const [mainProjects,setMainProjects]=useState(()=>{try{const s=localStorage.getItem('waf_mains');return s?JSON.parse(s):[{id:'main1', name:'Anderson Family Reunion 2026', startDate:'2026-07-04', endDate:'2026-07-06', location:'Fate, TX Community Center', description:'Annual reunion - 50 years', hashtag:'#WeAreFamily2026', startingBudget:15000, status:'Active', createdBy:'Frederick IMpowered Anderson', createdAt:new Date().toISOString(), uniqueID:uid()}]}catch{return []}});
 const [tasks,setTasks]=useState(()=>{try{const s=localStorage.getItem('waf_tasks');return s?JSON.parse(s):TASK_TEMPLATES.map(x=>({id:uid(),title:x.t,projectId:'main1',assignedTo:'c1',dueDate:'2026-06-15',priority:x.p,category:x.c,status:'Active'}))}catch{return []}});
 const [committee,setCommittee]=useState(()=>{try{const s=localStorage.getItem('waf_committee');return s?JSON.parse(s):[{id:'c1',name:'Frederick IMpowered Anderson',email:'frederick@wearefamily.com',role:'Main Admin',projects:['main1'],status:'Active',avatarInitials:'FA'}]}catch{return []}});

 useEffect(()=>{
   try{
     const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
     setSupabaseClient(client);
     client.from('main_projects').select('id').limit(1).then(({error})=>{
       if(error){setSyncStatus('needs-setup');} else {setSyncStatus('connected'); loadFromCloud(client);}
     });
     client.channel('sync-tasks').on('postgres_changes',{event:'*',schema:'public',table:'tasks'},()=>loadFromCloud(client)).subscribe();
     client.channel('sync-mains').on('postgres_changes',{event:'*',schema:'public',table:'main_projects'},()=>loadFromCloud(client)).subscribe();
   }catch(e){setSyncStatus('error');}
   const params=new URLSearchParams(window.location.search); const inviteEmail=params.get('invite');
   if(inviteEmail){
     if(confirm('You have been invited as ' + (params.get('role')||'Committee Member') + '! Join with ' + inviteEmail + '?')){
       const exists=committee.find(c=>c.email.toLowerCase()===inviteEmail.toLowerCase());
       if(!exists){
         const nm={id:uid(),name:inviteEmail.split('@')[0],email:inviteEmail,role:params.get('role')||'Coordinator',projects:params.get('project')?[params.get('project')]:[],status:'Active',avatarInitials:inviteEmail.substring(0,2).toUpperCase()};
         const updated=[...committee,nm]; setCommittee(updated); localStorage.setItem('waf_committee',JSON.stringify(updated));
       }
     }
     window.history.replaceState({},document.title,window.location.pathname);
   }
 },[]);

 async function loadFromCloud(client){
   const {data:mains}=await client.from('main_projects').select('*');
   if(mains && mains.length>0){
     setMainProjects(mains.map(m=>({id:m.id,name:m.name,startDate:m.start_date,endDate:m.end_date,location:m.location,description:m.description,hashtag:m.hashtag,startingBudget:m.starting_budget,status:m.status,createdBy:m.created_by,createdAt:m.created_at,uniqueID:m.unique_id})));
   } else {
     // Cloud empty, push local data to cloud (first time)
     console.log('Cloud empty, pushing local projects to cloud');
     mainProjects.forEach(async p=>{
       await client.from('main_projects').upsert({id:p.id,name:p.name,start_date:p.startDate,end_date:p.endDate,location:p.location,description:p.description,hashtag:p.hashtag,starting_budget:p.startingBudget,status:p.status,created_by:p.createdBy,created_at:p.createdAt,unique_id:p.uniqueID});
     });
   }
   const {data:ts}=await client.from('tasks').select('*');
   if(ts && ts.length>0){
     setTasks(ts.map(t=>({id:t.id,title:t.title,description:t.description,projectId:t.project_id,assignedTo:t.assigned_to,dueDate:t.due_date,priority:t.priority,category:t.category,status:t.status})));
   } else {
     console.log('Cloud tasks empty, pushing local tasks');
     tasks.forEach(async t=>{
       await client.from('tasks').upsert({id:t.id,title:t.title,description:t.description,project_id:t.projectId,assigned_to:t.assignedTo,due_date:t.dueDate,priority:t.priority,category:t.category,status:t.status});
     });
   }
 }
 async function forcePush(){
   if(!supabaseClient){alert('Not connected'); return;}
   for(const p of mainProjects){ await supabaseClient.from('main_projects').upsert({id:p.id,name:p.name,start_date:p.startDate,end_date:p.endDate,location:p.location,description:p.description,hashtag:p.hashtag,starting_budget:p.startingBudget,status:p.status,created_by:p.createdBy,created_at:p.createdAt,unique_id:p.uniqueID}); }
   for(const t of tasks){ await supabaseClient.from('tasks').upsert({id:t.id,title:t.title,description:t.description,project_id:t.projectId,assigned_to:t.assignedTo,due_date:t.dueDate,priority:t.priority,category:t.category,status:t.status}); }
   alert('Force pushed '+mainProjects.length+' projects and '+tasks.length+' tasks to cloud! Now check laptop 2 - refresh and you should see project details.');
 }

 async function saveToCloud(table,data){ if(!supabaseClient) return; try{await supabaseClient.from(table).upsert(data);}catch(e){console.log(e)}}
 useEffect(()=>{localStorage.setItem('waf_mains',JSON.stringify(mainProjects)); if(syncStatus==='connected'){mainProjects.forEach(p=>saveToCloud('main_projects',{id:p.id,name:p.name,start_date:p.startDate,end_date:p.endDate,location:p.location,description:p.description,hashtag:p.hashtag,starting_budget:p.startingBudget,status:p.status,created_by:p.createdBy,created_at:p.createdAt,unique_id:p.uniqueID}));}},[mainProjects]);
 useEffect(()=>{localStorage.setItem('waf_tasks',JSON.stringify(tasks)); if(syncStatus==='connected'){tasks.forEach(t=>saveToCloud('tasks',{id:t.id,title:t.title,description:t.description,project_id:t.projectId,assigned_to:t.assignedTo,due_date:t.dueDate,priority:t.priority,category:t.category,status:t.status}));}},[tasks]);

 function createMain(){
   if(!form.name) return; const id=uid(); const newMain={id,name:form.name,startDate:form.startDate,endDate:form.startDate,location:form.location,description:'',hashtag:form.hashtag||'#WeAreFamily',startingBudget:parseFloat(form.budget)||0,status:'Active',createdBy:'Frederick IMpowered Anderson',createdAt:new Date().toISOString(),uniqueID:uid()}; setMainProjects([...mainProjects,newMain]); const newTasks=TASK_TEMPLATES.map(x=>({id:uid(),title:x.t,projectId:id,assignedTo:committee[0]?.id||'c1',dueDate:form.startDate||'2026-07-04',priority:x.p,category:x.c,status:'Active'})); setTasks([...tasks,...newTasks]); setShowCreate(false);
 }
 function addMember(){
   if(!memberForm.name||!memberForm.email) return; const id=uid(); const nm={id,name:memberForm.name,email:memberForm.email,role:memberForm.role,projects:memberForm.projects,status:'Active',avatarInitials:memberForm.name.split(' ').map(n=>n[0]).join('').substring(0,2)}; setCommittee([...committee,nm]); const base=window.location.origin+window.location.pathname; const link=base+'?invite='+encodeURIComponent(memberForm.email)+'&project='+(memberForm.projects[0]||mainProjects[0]?.id||'')+'&role='+encodeURIComponent(memberForm.role); setInviteLink(link); navigator.clipboard.writeText(link); alert('Added! Invite link copied. Sync status: '+syncStatus+' - if green, they will see same data instantly.'); setShowMemberModal(false);
 }

 return (
 <div className="min-h-screen bg-[#f8fafc]">
  <div className="h-16 bg-gradient-to-r from-[#1e40af] to-[#1e3a8a] text-white flex items-center px-6 justify-between sticky top-0 z-50 border-b-4 border-[#dc2626]">
   <div className="flex items-center gap-3"><div className="w-9 h-9 bg-white rounded-lg flex items-center justify-center text-[#1e3a8a] font-black text-xl">W</div><span className="font-bold">We Are Family v4 AUTO SYNC</span><span className={"ml-3 text-xs px-3 py-1 rounded-full "+(syncStatus==='connected'?'bg-green-500':'bg-yellow-500')}>{syncStatus==='connected'?'TEAM SYNC ON - Everyone Auto-Connected':syncStatus}</span></div>
  </div>
  <div className="flex">
   <div className="w-[280px] bg-white border-r min-h-[calc(100vh-64px)] p-4 sticky top-16">
    <div className={"p-3 rounded-xl mb-4 "+(syncStatus==='connected'?'bg-green-50 border border-green-200':'bg-yellow-50 border border-yellow-200')}><div className="font-bold text-xs">{syncStatus==='connected'?'✅ AUTO SYNC ACTIVE':'CONNECTING'}</div><div className="text-xs mt-1">{syncStatus==='connected'?'Everyone who opens your Vercel link is instantly synced. No URL/key needed for them.':'Connecting...'}</div></div>
    <nav className="space-y-1">{['Dashboard','Projects','Master Tasks','Committee','Master Budget','Calendar','Conference','Message Board','Action/Decision Log','Admin Cloud Sync'].map(p=><button key={p} onClick={()=>setPage(p)} className={"w-full text-left px-3 py-2.5 rounded-lg text-sm "+(page===p?'bg-[#dc2626] text-white font-medium':'hover:bg-[#dbeafe] text-gray-700')}>{p}</button>)}</nav>
   </div>
   <div className="flex-1 p-6">
    {page==='Dashboard' && (
     <div><div className="bg-white p-5 rounded-xl shadow border-l-4 border-green-500 mb-6"><h2 className="font-bold">✅ Team Sync is now AUTOMATIC for everyone</h2><p className="text-sm mt-2">Baked-in Supabase: https://gzpoiworafpgmzoslldy.supabase.co - Incognito will now show TEAM SYNC ON green, not Local Only. Invite links add members to cloud instantly.</p><div className="mt-3 flex gap-2"><button onClick={()=>setShowCreate(true)} className="px-5 py-2.5 bg-[#1e3a8a] text-white rounded-lg">Create New Gathering</button><button onClick={()=>setPage('Committee')} className="px-4 py-2 border rounded-lg">Add Member + Invite</button></div></div>
     <div className="grid grid-cols-2 gap-4">{mainProjects.map(p=>{const t=tasks.filter(x=>x.projectId===p.id); return <div key={p.id} className="bg-white rounded-xl p-5 shadow border-l-4 border-[#dc2626]"><div className="font-bold">{p.name}</div><div className="text-xs text-blue-600">{p.hashtag}</div><div className="text-xs mt-2">{t.length} tasks - synced</div><button onClick={()=>{const found=mainProjects.find(mm=>mm.id===p.id); setSelProj(found); setPage('Project Detail');}} className="mt-3 w-full bg-[#2563eb] text-white py-2 rounded-lg text-sm">View Details</button></div>})}</div></div>
    )}
    {page==='Project Detail' && selProj && <div><button onClick={()=>setPage('Dashboard')} className="mb-4 px-3 py-1 bg-white border rounded">← Back</button><h1 className="text-2xl font-bold">{selProj.name}</h1><div className="mt-4 bg-white p-5 rounded-xl shadow"><h3 className="font-bold">Tasks for this project (synced)</h3><div className="mt-2 space-y-2">{tasks.filter(t=>t.projectId===selProj.id).map(t=><div key={t.id} className="flex items-center gap-2 p-2 border rounded"><input type="checkbox" checked={t.status==='Completed'} onChange={()=>{const upd=tasks.map(x=>x.id===t.id?{...x,status:x.status==='Completed'?'Active':'Completed'}:x); setTasks(upd);}}/><span className="flex-1 text-sm">{t.title}</span><span className="text-xs bg-gray-100 px-2 py-1 rounded">{t.status}</span></div>)}</div></div></div>}
    {page==='Committee' && <div><h1 className="text-2xl font-bold">Committee - Auto Sync</h1>{inviteLink && <div className="mt-4 p-3 bg-green-50 border border-green-200 rounded-xl text-sm"><div className="font-bold">Invite link (auto-copied, auto-syncs to cloud):</div><div className="break-all text-blue-600 text-xs mt-1">{inviteLink}</div></div>}<div className="grid grid-cols-3 gap-4 mt-4">{committee.map(m=><div key={m.id} className="bg-white p-4 rounded-xl shadow border-l-4 border-[#dc2626]"><div className="flex gap-3"><div className="w-10 h-10 rounded-full bg-[#1e3a8a] text-white flex items-center justify-center font-bold">{m.avatarInitials}</div><div><div className="font-bold text-sm">{m.name}</div><div className="text-xs text-gray-500">{m.role} - {m.email}</div></div></div></div>)}</div><button onClick={()=>setShowMemberModal(true)} className="mt-4 px-4 py-2 bg-[#1e3a8a] text-white rounded-lg">Add Member + Auto Invite Link</button></div>}
    {page==='Admin Cloud Sync' && <div><h1 className="text-2xl font-bold">Admin Cloud Sync - Baked In</h1><div className="mt-4 bg-white p-5 rounded-xl shadow"><button onClick={forcePush} className="mb-4 px-4 py-2 bg-green-600 text-white rounded-lg font-bold">🚀 FORCE PUSH MY DATA TO CLOUD (Click this on Laptop 1)</button><h3 className="font-bold">Sync Status: {syncStatus}</h3><p className="text-sm mt-2">URL: https://gzpoiworafpgmzoslldy.supabase.co</p><div className="mt-4 p-3 bg-green-50 rounded"><p className="text-sm font-bold text-green-700">FIXED: Everyone who opens your Vercel link now auto-connected. Incognito will show TEAM SYNC ON green.</p></div></div></div>}
    {['Master Tasks','Master Budget','Calendar','Conference','Message Board','Action/Decision Log','Projects'].includes(page) && <div className="bg-white p-5 rounded-xl shadow"><h2 className="font-bold">{page}</h2><p className="text-sm mt-2">Full version with auto-sync - {tasks.length} tasks synced to cloud: {syncStatus}</p><div className="mt-3 space-y-2">{tasks.map(t=><div key={t.id} className="p-2 border rounded text-sm flex justify-between"><span>{t.title} - {t.projectId}</span><span className="text-xs">{t.status}</span></div>)}</div><button onClick={()=>{const proj=tasks[0]?.projectId; if(proj){const p=mainProjects.find(m=>m.id===proj); if(p){setSelProj(p); setPage('Project Detail');}}}} className="mt-3 px-3 py-1 bg-blue-600 text-white rounded text-xs">Open First Project Details</button></div>}
   </div>
  </div>
  {showCreate && <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[100] p-4"><div className="bg-white rounded-2xl w-full max-w-lg p-6"><h2 className="font-bold">Create New Gathering - Auto Syncs to Team</h2><div className="mt-4 space-y-3"><input value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Name *" className="w-full border rounded-lg px-3 py-2"/><input type="date" value={form.startDate} onChange={e=>setForm({...form,startDate:e.target.value})} className="w-full border rounded-lg px-3 py-2"/><input value={form.hashtag} onChange={e=>setForm({...form,hashtag:e.target.value})} placeholder="#Hashtag" className="w-full border rounded-lg px-3 py-2"/><input type="number" value={form.budget} onChange={e=>setForm({...form,budget:e.target.value})} placeholder="Budget" className="w-full border rounded-lg px-3 py-2"/><div className="flex justify-end gap-2"><button onClick={()=>setShowCreate(false)} className="px-4 py-2 border rounded-lg">Cancel</button><button onClick={createMain} className="px-4 py-2 bg-[#1e3a8a] text-white rounded-lg">Create + Sync to Team</button></div></div></div></div>}
  {showMemberModal && <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-[100] p-4"><div className="bg-white rounded-2xl w-full max-w-md p-6"><h3 className="font-bold">Add Member - Auto Sync</h3><div className="mt-3 space-y-2"><input value={memberForm.name} onChange={e=>setMemberForm({...memberForm,name:e.target.value})} placeholder="Name" className="w-full border rounded px-3 py-2"/><input value={memberForm.email} onChange={e=>setMemberForm({...memberForm,email:e.target.value})} placeholder="Email *" className="w-full border rounded px-3 py-2"/><input value={memberForm.role} onChange={e=>setMemberForm({...memberForm,role:e.target.value})} placeholder="Role" className="w-full border rounded px-3 py-2"/><div className="flex justify-end gap-2 mt-2"><button onClick={()=>setShowMemberModal(false)} className="px-4 py-2 border rounded">Cancel</button><button onClick={addMember} className="px-4 py-2 bg-[#1e3a8a] text-white rounded">Add + Copy Invite</button></div></div></div></div>}
 </div>
 );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
